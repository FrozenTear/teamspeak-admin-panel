# Example secret bundle for ts6-manager. Copy to `secrets.yaml` and fill
# in real values. Do not `podman kube play` the committed manifest:
# fullstack, music, and sidecar are `@UNRELEASED`, which fails reference
# parsing. Start and restart only with:
#
#   ./scripts/update.sh vX.Y.Z
#
# update.sh concatenates `secrets.yaml` when `podman secret
# ts6-manager-secrets` is not already on the host (multi-file
# `podman kube play` needs Podman >= 5.0; the script keeps 4.4+ working).
#
# Never commit a populated `secrets.yaml`. The `.gitignore` excludes it.
---
apiVersion: v1
kind: Secret
metadata:
  name: ts6-manager-secrets
  labels:
    app: ts6-manager
type: Opaque
stringData:
  # 32+ byte random string. Generate with:
  #   openssl rand -base64 48
  JWT_SECRET: "change-me-jwt-secret-must-be-at-least-32-bytes-long"
  # 32-byte base64-encoded key for AES-256-GCM. Generate with:
  #   openssl rand -base64 32
  # Leave empty to disable at-rest encryption (not recommended for prod).
  ENCRYPTION_KEY: ""
