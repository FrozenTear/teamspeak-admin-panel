# TS6 Manager — Kubernetes-flavoured manifest for `podman kube play`.
#
# Brings up the manager stack rootless on a clean Podman >= 4.4 host.
# `podman kube play` takes a single kube file (multi-file args need
# Podman 5.0+), so concat the Secret + Pod manifest first:
#
#   cat deploy/kube/secrets.example.yaml deploy/kube/ts6-manager.yaml \
#     > /tmp/ts6-manager.kube.yaml
#   podman kube play /tmp/ts6-manager.kube.yaml
#   podman kube down deploy/kube/ts6-manager.yaml
#
# See deploy/kube/README.md for env setup, image overrides, and the
# local-build smoke path. Topology mirrors podman-compose.yml + the
# Quadlet pod in deploy/quadlet/ (impl-plan §9). Volumes are PVCs so
# named-volume ownership crosses the rootless userns cleanly
# (PURA-67).
---
# State root (/var/lib/ts6-manager). ts6-db / ts6-music mount on top as
# nested volumes; ts6-data additionally persists operator uploads the
# server writes under DATA_DIR — the yt-dlp cookie file (PURA-314).
# Without it those uploads sit on the ephemeral overlay and are wiped on
# every pod recreation while the upload-timestamp row in ts6-db survives.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ts6-data
  labels:
    app: ts6-manager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ts6-db
  labels:
    app: ts6-manager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ts6-music
  labels:
    app: ts6-manager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ts6-manager
  labels:
    app: ts6-manager
spec:
  restartPolicy: Always
  # Host networking is required, not a perf tweak. The manager's
  # WebQuery client reaches the TS6 fixture (and any operator-added
  # production TS6 server colocated on the same host) over the
  # rootless-podman host. Without hostNetwork the pod sits on the
  # default pod-bridge and egresses through passt — the same path
  # that wedges TS6 6.0.0-beta9 WebQuery after ~5 requests
  # (PURA-105, see docs/ts6-fixture.md "Why --network=host is
  # mandatory"). The dashboard tick worker fans out 4 reads every
  # 5 s, so a fresh fixture wedges within ~30 s of operator activity.
  # hostNetwork drops passt from the call path; manager-side surface
  # area is unchanged because the pod already advertises its
  # listeners as hostPort (3001/tcp, 4443/udp). Sidecar control
  # :7080 stays on 127.0.0.1 only — not a public host port, and
  # not on public Caddy.
  hostNetwork: true
  securityContext:
    runAsNonRoot: true
    fsGroup: 10001
  containers:
    # Keep fullstack + sidecar on the same release tag. Bump both on a
    # release cut, or pass TAG to scripts/update.sh (overrides both).
    - name: fullstack
      image: ghcr.io/frozentear/ts6-manager-fullstack:v1.6.2
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
      ports:
        # Under `hostNetwork: true` the container shares the host's net
        # namespace, so `containerPort` IS the host port — `hostPort:`
        # would be both redundant and rejected by Podman with
        # "PortMappings can only be used with Bridge, slirp4netns, or
        # pasta networking".
        - name: http
          containerPort: 3001
          protocol: TCP
      env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_PRETTY
          value: ""
        - name: FRONTEND_URL
          value: "https://panel.scuffedcrew.no"
        # hops=1 matches host Caddy for panel.scuffedcrew.no (#50/#51)
        - name: TRUSTED_PROXY_HOPS
          value: "1"
        - name: DATABASE_URL
          value: "surrealkv:///var/lib/ts6-manager/db"
        - name: MUSIC_DIR
          value: "/var/lib/ts6-manager/music"
        # Where the server writes operator uploads not held in the
        # SurrealKV store (the yt-dlp cookie file, PURA-314). Pinned
        # explicitly — the server default is the cwd-relative `./data`.
        # Sits inside the ts6-data volume so the cookie survives pod
        # recreation.
        - name: DATA_DIR
          value: "/var/lib/ts6-manager/data"
        - name: SIDECAR_URL
          value: "http://127.0.0.1:7080"
        # Contabo Music+Voice split: fullstack keeps Panel/API/Surreal
        # and proxies bot lifecycle to the sibling music unit. Unset on
        # hosts that still run the in-process supervisor (dev / Quadlet).
        - name: MUSIC_RUNTIME_URL
          value: "http://127.0.0.1:3002"
      envFrom:
        - secretRef:
            name: ts6-manager-secrets
      volumeMounts:
        # State root — ts6-db / ts6-music nest on top of this. Listed
        # first; podman kube play orders mounts parent-before-child.
        - name: ts6-data
          mountPath: /var/lib/ts6-manager
        - name: ts6-db
          mountPath: /var/lib/ts6-manager/db
        - name: ts6-music
          mountPath: /var/lib/ts6-manager/music
      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
    # Contabo-only Music+Voice unit. Owns decode → Opus → TS6 wire send
    # (the only send loop). hostNetwork inherited from the pod —
    # containerPort 3002 IS the host port. Do not use kube httpGet:
    # Podman 5.6 turns that into in-container curl and this image has
    # none (sidecar pattern: exec binary --healthcheck-url).
    - name: music
      image: ghcr.io/frozentear/ts6-manager-music:v1.6.2
      imagePullPolicy: IfNotPresent
      securityContext:
        # Same uid as fullstack so ts6-data identities + ts6-music
        # library files stay writable (volumes are 10001 / fsGroup 10001).
        # Isolation is the container + cpuset, not a second uid.
        runAsUser: 10001
        runAsGroup: 10001
      args:
        - "--listen"
        - "0.0.0.0:3002"
      ports:
        - name: music
          containerPort: 3002
          protocol: TCP
      env:
        - name: LOG_LEVEL
          value: "info"
        - name: MUSIC_DIR
          value: "/var/lib/ts6-manager/music"
        - name: DATA_DIR
          value: "/var/lib/ts6-manager/data"
        # Intra-container SEND pin (option 1). NOT HostConfig.
        # Packing B (Robert): fullstack soft-pin stays 2-5. DECODE 2-5
        # pins decode-rt (pipeline/fetch/bridge/resolve) and
        # pin_decode_child (ffmpeg/yt-dlp) — share Axum, never send 0-1.
        # Never set music HostConfig to 0-1 (packing C; apply script refuses).
        - name: TS6_BOT_CPUSET
          value: "0-1"
        - name: TS6_BOT_SEND_CPUSET
          value: "0-1"
        - name: TS6_BOT_DECODE_CPUSET
          value: "2-5"
        - name: TS6_BOT_NICE
          value: "-5"
      volumeMounts:
        - name: ts6-data
          mountPath: /var/lib/ts6-manager
        - name: ts6-music
          mountPath: /var/lib/ts6-manager/music
      readinessProbe:
        exec:
          command:
            - /usr/local/bin/ts6-manager-music
            - --healthcheck-url
            - http://127.0.0.1:3002/health
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command:
            - /usr/local/bin/ts6-manager-music
            - --healthcheck-url
            - http://127.0.0.1:3002/health
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
    - name: sidecar
      image: ghcr.io/frozentear/ts6-manager-sidecar:v1.6.2
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 10002
        runAsGroup: 10002
      args:
        - "--listen"
        - "[::]:4443"
        # Control plane has no auth (POST /source starts FFmpeg).
        # hostNetwork + 0.0.0.0 would publish :7080 on every host
        # interface. Fullstack uses SIDECAR_URL=http://127.0.0.1:7080.
        # Keep this off public Caddy (panel.scuffedcrew.no → :3001).
        - "--http-listen"
        - "127.0.0.1:7080"
        - "--tls-generate"
        - "localhost"
      ports:
        # Same constraint as the fullstack container above: under
        # `hostNetwork: true` the `containerPort` is reachable directly
        # on the host; `hostPort` is rejected.
        - name: control
          containerPort: 7080
          protocol: TCP
        - name: webtransport
          containerPort: 4443
          protocol: UDP
      # `podman kube play` (verified Podman 5.6.0) materializes kube
      # `httpGet` as an in-container CMD-SHELL HealthCmd
      # `curl -f http://localhost:<port>/health || exit 1` and
      # *overrides* the image HEALTHCHECK. The sidecar runtime has
      # neither curl nor wget, so httpGet fails at exec (`curl: not
      # found`) and `restartPolicy: Always` restart-loops the
      # container (~105s: 30s start-period + 3 × 30s). Use an exec
      # probe that invokes the binary, matching the OCI HEALTHCHECK
      # and Quadlet HealthCmd. Do not switch these to exec + curl.
      readinessProbe:
        exec:
          command:
            - /usr/local/bin/ts6-media-sidecar
            - --healthcheck-url
            - http://127.0.0.1:7080/health
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command:
            - /usr/local/bin/ts6-media-sidecar
            - --healthcheck-url
            - http://127.0.0.1:7080/health
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
  volumes:
    - name: ts6-data
      persistentVolumeClaim:
        claimName: ts6-data
    - name: ts6-db
      persistentVolumeClaim:
        claimName: ts6-db
    - name: ts6-music
      persistentVolumeClaim:
        claimName: ts6-music
